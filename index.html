<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emploi du temps — Portail SITE / SV</title>
  <style>html,body{margin:0;background:transparent;}</style>
</head>
<body>

  <!-- Aperçu. Sur KSUP : ajouter data-portail="st" ou data-portail="sv" au div. -->
  <div id="edt-portail-st"></div>

  <script src="edt.js?v=19"></script>

  <!-- Transmet la hauteur au parent (utile si intégré en iframe) -->
  <script>
    (function () {
      function h(){ if(window.parent&&window.parent!==window){ window.parent.postMessage({edtHeight:document.documentElement.scrollHeight},"*"); } }
      window.addEventListener("load",h); window.addEventListener("resize",h);
      if(window.MutationObserver){ new MutationObserver(h).observe(document.getElementById("edt-portail-st"),{childList:true,subtree:true}); }
      setInterval(h,1000);
    })();
  </script>
</body>
</html>
